<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="YouTube Client logo">
  <title>YouTube Client</title>
  <defs>
    <linearGradient id="ytc-badge" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/>
      <stop offset="0.55" stop-color="#F01A32"/>
      <stop offset="1" stop-color="#B80022"/>
    </linearGradient>
    <linearGradient id="ytc-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#ytc-badge)"/>
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#ytc-sheen)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- play head: video source -->
  <path d="M 152 166 L 152 346 L 274 256 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round"/>

  <!-- transcript lines: the text it becomes -->
  <g fill="#FFFFFF">
    <rect x="318" y="184" width="102" height="28" rx="14"/>
    <rect x="318" y="242" width="80" height="28" rx="14" fill-opacity="0.86"/>
    <rect x="318" y="300" width="56" height="28" rx="14" fill-opacity="0.72"/>
  </g>
</svg>
